# Daily: if decolua/9router has a newer release tag than our newest local/<ver>-fc<N> branch,
# re-apply the patch commits onto it, push that one branch, and dispatch build-image.
# Conflict / patch-set-empty / push-rejected / dispatch-failed => open an issue (if Issues are
# enabled) and fail the run.
name: sync-upstream

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Git identity and upstream remote
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/decolua/9router.git
      - name: Sync
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp scripts/sync.sh /tmp/sync.sh   # the script checks out other trees; run it from outside
          set +e; bash /tmp/sync.sh; rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Open an issue when manual action is needed
        if: steps.sync.outputs.rc == '2' || steps.sync.outputs.rc == '3' || steps.sync.outputs.rc == '4' || steps.sync.outputs.rc == '5'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "${{ steps.sync.outputs.rc }}" in
            2) t="sync-upstream: patch conflict on new upstream release";;
            3) t="sync-upstream: upstream now contains all patches - switch to the stock image";;
            4) t="sync-upstream: push of the new patch branch was rejected";;
            5) t="sync-upstream: new patch branch pushed but build-image was not dispatched";;
          esac
          gh issue create --title "$t" --body "See the run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Fix locally with ./upgrade.sh and push the local/* branch, then run build-image." || echo "could not open an issue (Issues may be disabled on this fork)"
      - name: Fail the run if the sync needs attention
        if: steps.sync.outputs.rc != '0'
        run: exit 1
